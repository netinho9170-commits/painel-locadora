name: Avisos diários do Giro Frota

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 07:00 em Manaus
  workflow_dispatch:
    inputs:
      teste:
        description: 'Mandar notificação de teste mesmo sem avisos (1 = sim)'
        required: false
        default: '0'

permissions:
  contents: read
  id-token: write   # login no Google sem chave (Workload Identity)

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/778333072083/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'giro-avisos@painel-locadora.iam.gserviceaccount.com'
      - run: npm install --no-save firebase-admin@14.4.0
      - run: node robo/avisos.mjs
        env:
          GCLOUD_PROJECT: painel-locadora
          TESTE: ${{ github.event.inputs.teste }}
          # WhatsApp oficial (Meta). Sem estes segredos o robô roda em modo simulação.
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
